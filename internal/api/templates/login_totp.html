{{define "login_totp.html"}}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>Verify · Torkitten</title><link rel="stylesheet" href="/assets/app.css"></head><body class="auth"><main class="card auth-card"><div class="brand"><span class="brand-mark">T</span><span>Torkitten</span></div><p class="eyebrow">Second factor</p><h1>Enter your TOTP code</h1>{{if .Error}}<div class="alert" role="alert">{{.Error}}</div>{{end}}<form method="post" action="/login/totp"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Authentication code<input id="totp" name="totp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus></label><button id="sign-in" type="submit">Sign in</button></form><a class="subtle-link" href="/login">Start over</a></main></body></html>{{end}}
