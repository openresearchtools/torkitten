{{define "setup_totp.html"}}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>Enroll TOTP · Torkitten</title><link rel="stylesheet" href="/assets/app.css"></head><body class="auth"><main class="card auth-card"><div class="brand">🐱 <span>Torkitten</span></div><p class="eyebrow">Second factor</p><h1>Scan the TOTP code</h1><p class="muted">Add this account to your authenticator, then enter its current six-digit code.</p><img class="qr" src="/setup/qr" referrerpolicy="no-referrer" alt="TOTP enrollment QR code">{{if .Error}}<div class="alert" role="alert">{{.Error}}</div>{{end}}<form method="post" action="/setup/totp"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Authentication code<input id="totp" name="totp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus></label><button id="finish" type="submit">Finish setup</button></form></main></body></html>{{end}}
