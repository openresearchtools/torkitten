{{define "login.html"}}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>Sign in · Torkitten</title><link rel="stylesheet" href="/assets/app.css"></head><body class="auth"><main class="card auth-card"><div class="brand">🐱 <span>Torkitten</span></div><p class="eyebrow">Local administration</p><h1>Welcome back</h1><p class="muted">Use the same Authelia owner credentials as your onion applications.</p>{{if .Error}}<div class="alert" role="alert">{{.Error}}</div>{{end}}<form method="post" action="/login/password"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Username<input id="username" name="username" autocomplete="username" required maxlength="32" autofocus></label><label>Password<input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required></label><button id="continue" type="submit">Continue</button></form><p class="fine">This page is available only on <strong>localhost</strong>.</p></main></body></html>{{end}}
