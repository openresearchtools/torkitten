name: Third-party binaries

on:
  workflow_dispatch:
    inputs:
      rebuild_third_party:
        description: Rebuild Tor, Caddy, and Authelia even when their caches exist
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component:
          - tor
          - caddy
          - authelia
    env:
      TORKITTEN_SOURCE_ROOT: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Keep build data outside the checkout
        run: echo "TORKITTEN_BUILD_ROOT=$RUNNER_TEMP/torkitten-build" >> "$GITHUB_ENV"

      - name: Verify vendored source
        run: ./tools/verify-vendor.sh

      - name: Derive versioned identity
        id: identity
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          source tools/build/common.sh
          build_key=$(component_build_key "$COMPONENT")
          release=$(lock_value "$COMPONENT" release)
          tree=$(lock_value "$COMPONENT" tree)
          {
            echo "build_key=$build_key"
            echo "cache_key=third-party-$COMPONENT-$build_key"
            echo "artifact_name=third-party-$COMPONENT-$release-${tree:0:12}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore completed binary bundle
        id: binary-cache
        if: ${{ !inputs.rebuild_third_party }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/torkitten-build/artifacts/third-party/${{ matrix.component }}
          key: ${{ steps.identity.outputs.cache_key }}

      - name: Build pinned release
        if: ${{ steps.binary-cache.outputs.cache-hit != 'true' }}
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          docker build \
            --file tools/build/Containerfile \
            --tag torkitten-builder:ubuntu-24.04 \
            tools/build
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --volume "$TORKITTEN_BUILD_ROOT:/work:rw" \
            --env TORKITTEN_SOURCE_ROOT=/src \
            --env TORKITTEN_BUILD_ROOT=/work \
            --env TORKITTEN_BUILD_JOBS="$(nproc)" \
            torkitten-builder:ubuntu-24.04 \
            /src/tools/build-third-party.sh "$COMPONENT"

      - name: Verify binary bundle
        id: bundle
        env:
          COMPONENT: ${{ matrix.component }}
          EXPECTED_KEY: ${{ steps.identity.outputs.build_key }}
        run: |
          artifact_dir="$TORKITTEN_BUILD_ROOT/artifacts/third-party/$COMPONENT/$EXPECTED_KEY"
          test -f "$artifact_dir/.complete"
          test -s "$artifact_dir/BUILD-METADATA"
          test "$(sed -n 's/^component=//p' "$artifact_dir/BUILD-METADATA")" = "$COMPONENT"
          test "$(sed -n 's/^build_key=//p' "$artifact_dir/BUILD-METADATA")" = "$EXPECTED_KEY"
          test "$(sed -n 's/^go_telemetry=//p' "$artifact_dir/BUILD-METADATA" || true)" != "on"
          binary_sha=$(sed -n 's/^binary_sha256=//p' "$artifact_dir/BUILD-METADATA")
          binary="$artifact_dir/usr/bin/$COMPONENT"
          test -x "$binary"
          test "$(sha256sum "$binary" | cut -d ' ' -f 1)" = "$binary_sha"
          test -s "$artifact_dir/usr/share/doc/torkitten/third-party/$COMPONENT/LICENSE"
          case "$COMPONENT" in
            authelia)
              grep -qx 'runtime_metrics=forced_off_by_torkitten_supervisor' "$artifact_dir/BUILD-METADATA"
              ;;
            caddy)
              grep -qx 'runtime_opentelemetry=disabled_by_torkitten_supervisor' "$artifact_dir/BUILD-METADATA"
              ;;
            tor)
              privacy_config=$(sed -n 's/^runtime_privacy_config=//p' "$artifact_dir/BUILD-METADATA")
              test -s "$artifact_dir/$privacy_config"
              test "$(wc -l < "$artifact_dir/$privacy_config")" -eq 10
              ;;
          esac
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"

      - name: Upload reusable binary bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: ${{ steps.bundle.outputs.artifact_dir }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  consume:
    name: Consume reusable bundles
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download this run's Tor, Caddy, and Authelia bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: third-party-*
          path: ${{ runner.temp }}/third-party

      - name: Verify downstream inputs
        run: |
          mapfile -t metadata < <(find "$RUNNER_TEMP/third-party" -name BUILD-METADATA -type f | sort)
          test "${#metadata[@]}" -eq 3
          components=()
          for metadata_file in "${metadata[@]}"; do
            component=$(sed -n 's/^component=//p' "$metadata_file")
            components+=("$component")
            binary_sha=$(sed -n 's/^binary_sha256=//p' "$metadata_file")
            bundle_dir=$(dirname "$metadata_file")
            test "$(sha256sum "$bundle_dir/usr/bin/$component" | cut -d ' ' -f 1)" = "$binary_sha"
            sed -n '/^component=/p; /^release=/p; /^source_commit=/p; /^binary_sha256=/p' "$metadata_file"
          done
          test "$(printf '%s\n' "${components[@]}" | sort | tr '\n' ' ')" = "authelia caddy tor "
