[workspace]
resolver = "2"
members = [
    "crates/torkitten-auth",
    "crates/torkitten-core",
    "crates/torkitten-proxy",
    "crates/torkitten-tor",
    "crates/torkitten-vault",
    "crates/torkittend",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/openresearchtools/torkitten"

[workspace.dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
data-encoding = "2"
ed25519-dalek = { version = "2", features = ["zeroize"] }
getrandom = "0.4"
hmac = "0.12"
openssl = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
rcgen = { version = "0.14.10", features = ["x509-parser"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
time = "0.3.55"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
webauthn-rs = "0.5.5"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
x509-parser = "0.18"
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
